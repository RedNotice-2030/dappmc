services:
  - type: web
    name: dappmc
    env: docker
    plan: free
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_CRYPTO
        value: tls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: DAPPMC Cares
      - key: CONTACT_RECIPIENT
        sync: false
